# Include within the HTTPS server block that serves the university frontend.
gzip on;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

# Vite bundles use content hashes and can be cached independently of the HTML shell.
location ~ "^/assets/[^/]+\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
